<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>드로미 디자인시스템</title>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: grid; grid-template-columns: 248px 1fr;
         background: #EDEFF3; color: #101217;
         font-family: 'IBM Plex Sans KR', -apple-system, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: 'IBM Plex Mono', Menlo, monospace; }

  /* ── 좌측 목록 ─────────────────────────── */
  .side { display: flex; flex-direction: column; background: #FFFFFF;
          border-right: 1px solid #DCE0E7; overflow-y: auto; }
  .brand { padding: 22px 20px 18px; display: flex; flex-direction: column; gap: 7px;
           border-bottom: 1px solid #EDEFF3; }
  .brand .nm { font-size: 15px; font-weight: 700; letter-spacing: -.025em; }
  .brand .vr { font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 10.5px;
               color: #7B828E; display: flex; align-items: center; gap: 7px; }
  .brand .vr b { background: #EDEFF3; color: #4A505C; font-weight: 500;
                 padding: 2px 6px; border-radius: 3px; }

  .nav { padding: 14px 12px 24px; display: flex; flex-direction: column; gap: 2px; }
  .sec { font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 9.5px;
         letter-spacing: .07em; text-transform: uppercase; color: #A8B0BD;
         padding: 16px 8px 7px; }
  .nav a { display: flex; align-items: center; gap: 9px; padding: 8px 10px;
           border-radius: 5px; font-size: 13.5px; letter-spacing: -.01em; color: #2B2E3A;
           transition: background 120ms, color 120ms; }
  .nav a:hover { background: #F7F8FA; }
  .nav a.on { background: #ECF5FE; color: #2470DB; font-weight: 600; }
  .nav a .dt { width: 5px; height: 5px; border-radius: 50%; background: #DCE0E7; flex: none; }
  .nav a.on .dt { background: #2470DB; }
  .nav .soon { color: #A8B0BD; cursor: default; }
  .nav .soon:hover { background: none; }
  .nav .soon .dt { background: none; box-shadow: inset 0 0 0 1px #DCE0E7; }

  /* ── 본문 ─────────────────────────── */
  .main { display: flex; flex-direction: column; min-width: 0; }
  .bar { display: flex; align-items: center; gap: 14px; height: 46px; flex: none;
         padding: 0 18px; background: #FFFFFF; border-bottom: 1px solid #DCE0E7; }
  .bar .ttl { font-size: 13px; font-weight: 600; letter-spacing: -.015em; }
  .bar .sub { font-size: 11.5px; color: #7B828E; }
  .bar .sp { flex: 1 1 auto; }
  .bar .lnk { font-family: 'IBM Plex Mono', Menlo, monospace; font-size: 10.5px;
              color: #7B828E; padding: 5px 9px; border: 1px solid #DCE0E7;
              border-radius: 4px; transition: border-color 120ms, color 120ms; }
  .bar .lnk:hover { color: #2B2E3A; border-color: #A8B0BD; }
  .stage { flex: 1 1 auto; min-height: 0; background: #EDEFF3; padding: 16px; }
  .stage iframe { width: 100%; height: 100%; border: 1px solid #DCE0E7; border-radius: 6px;
                  background: #FFFFFF; display: block; }

  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .side { border-right: none; border-bottom: 1px solid #DCE0E7; max-height: 210px; }
    .stage { padding: 0; }
    .stage iframe { border: none; border-radius: 0; }
  }
</style>
</head>
<body>

<nav class="side">
  <div class="brand">
    <span class="nm">드로미 디자인시스템</span>
    <span class="vr"><b>v0.11</b> 2026-09-02</span>
  </div>
  <div class="nav" id="nav">
    <a href="#/overview" data-t="시스템 개요" data-s="전체 목록 · 토큰 · 규칙 14개"><i class="dt"></i>시스템 개요</a>

    <span class="sec">Foundations</span>
    <a href="#/foundations/colors" data-t="컬러" data-s="브랜드 2 · 중립 15단계 · 시맨틱 4"><i class="dt"></i>컬러</a>
    <a href="#/foundations/typography" data-t="타이포그래피" data-s="Pretendard · 크기 8 · 굵기 4"><i class="dt"></i>타이포그래피</a>
    <a href="#/foundations/spacing" data-t="간격 · 레이아웃" data-s="4px 그리드 · space 11단 · radius 6단"><i class="dt"></i>간격 · 레이아웃</a>
    <a href="#/foundations/depth" data-t="깊이" data-s="그림자 3단 · z-index 8단"><i class="dt"></i>깊이</a>

    <span class="sec">Components</span>
    <a href="#/components/button" data-t="버튼" data-s="4 variant × 4 size × 5 state"><i class="dt"></i>버튼</a>
    <a href="#/components/input" data-t="입력 요소" data-s="6 요소 × 4 state"><i class="dt"></i>입력 요소</a>
    <a href="#/components/badge" data-t="배지 · 칩" data-s="상태 5색 · 필터 칩"><i class="dt"></i>배지 · 칩</a>
    <a href="#/components/table" data-t="데이터 테이블" data-s="행 상태 · 빈 상태 2종"><i class="dt"></i>데이터 테이블</a>
    <a href="#/components/feedback" data-t="알림 3종" data-s="토스트 · 배너 · 다이얼로그"><i class="dt"></i>알림 3종</a>

    <span class="sec">아직 없는 것</span>
    <a class="soon"><i class="dt"></i>헤더 · 메뉴바</a>
    <a class="soon"><i class="dt"></i>폼 레이아웃</a>
    <a class="soon"><i class="dt"></i>탭 · 툴팁</a>
    <a class="soon"><i class="dt"></i>차트 팔레트</a>
    <a class="soon"><i class="dt"></i>아이콘</a>
  </div>
</nav>

<div class="main">
  <div class="bar">
    <span class="ttl" id="ttl">시스템 개요</span>
    <span class="sub" id="sub">전체 목록 · 토큰 · 규칙 14개</span>
    <span class="sp"></span>
    <a class="lnk" id="raw" href="overview.html" target="_blank" rel="noopener">파일로 열기 ↗</a>
  </div>
  <div class="stage">
    <iframe id="fr" title="디자인시스템 견본" src="overview.html"></iframe>
  </div>
</div>

<script>
  var nav = document.getElementById('nav');
  var fr = document.getElementById('fr');
  var ttl = document.getElementById('ttl');
  var sub = document.getElementById('sub');
  var raw = document.getElementById('raw');

  function pathFor(route) {
    return route === '/overview' ? 'overview.html' : route.replace(/^\//, '') + '.html';
  }

  function go() {
    var route = location.hash.slice(1) || '/overview';
    var link = nav.querySelector('a[href="#' + route + '"]');
    if (!link) { route = '/overview'; link = nav.querySelector('a[href="#/overview"]'); }

    [].forEach.call(nav.querySelectorAll('a'), function (a) { a.classList.remove('on'); });
    link.classList.add('on');

    var src = pathFor(route);
    if (fr.getAttribute('src') !== src) fr.setAttribute('src', src);
    raw.href = src;
    ttl.textContent = link.dataset.t;
    sub.textContent = link.dataset.s;
    document.title = link.dataset.t + ' — 드로미 디자인시스템';
  }

  /* 개요 페이지의 카드 클릭 — iframe 이 부모 주소를 직접 못 바꾸므로 메시지로 받습니다 */
  addEventListener('message', function (e) {
    if (e.data && e.data.dsRoute) location.hash = '#' + e.data.dsRoute;
  });

  addEventListener('hashchange', go);
  go();
</script>

</body>
</html>
